<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="quiz.css" />
     <link
      rel="icon"
      href="assets/Crountch-One-Piece-Jolly-Roger-Luffys-flag.256.png"
      sizes="20px"
    />
    <title>One Piece Quiz</title>
  </head>
  <body>
    <h1 class="heading">One Piece Quiz</h1>
    <div class="quizContainer">
      <div class="content">
        <div class="difficulties">
          <p id="pHeading">Choose Difficulty</p>
          <button class="diffBtn" id="easy">Marine Recruit</button>
          <button class="diffBtn" id="medium">Grand Line Veteran</button>
          <button class="diffBtn" id="hard">Yonko</button>
        </div>
        <span id="question"></span>
        <button class="options" id="option1"></button>
        <button class="options" id="option2"></button>
        <button class="options" id="option3"></button>
        <button class="options" id="option4"></button>
      </div>
      <div class="currDifficulty"></div>
      <div class="scoreCard"></div>
      <button id="next">Next -></button>
    </div>
    <div class="popupBackdrop"></div>
    <div class="popUp">
      <div class="upperSection">
      <img class="img" src="assets/gol d roger.jpg" >
      <span>You have achieved the bounty of a Pirate King<br><strong>5B Berries</strong></span>
      </div> 
      <div class="btnContainer">
        <button class="popUp-btn"  id="restart">Restart the Quiz</button>
        <button class="popUp-btn" id="memoryMatch">Test Your Memory with Memory-match</button>
      </div>
    </div>
    <script src="quiz.js"></script>
  </body>
  </html>
